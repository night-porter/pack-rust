name = "rust"
description = "Rust review: clippy, rustfmt, tests, unsafe, error handling, MSRV and Cargo.lock"
version = "0.1.0"

[[steps]]
name = "standards"
hook = "pre_fix"
prompt = "steps/standards.md"

[[steps]]
name = "check"
hook = "post_fix"
prompt = "steps/check.md"

[[steps]]
name = "review"
hook = "pre_push"
prompt = "steps/review.md"
